<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#fbf9ff" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="A private meme-sharing chat for two. Everything stays on your phones." />
    <meta name="referrer" content="no-referrer" />
    <title>Meme Pals</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <!-- iOS: run standalone from the Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Meme Pals" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <style>
      /* Paint the right background before the CSS bundle loads (no white flash in dark mode). */
      html { background: #f7f3ff; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #0f0c14; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Meme Pals needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
