# Optional TURN server for Meme Pals (coturn).
#
# TURN is only needed when both phones sit behind strict NATs (common on some
# mobile carriers) and a direct WebRTC connection fails. TURN forwards packets
# that are already DTLS-encrypted end to end: it cannot read them, and this
# config stores nothing on disk.
#
# Replace every CHANGE-ME value. See deploy/README.md ("Optional: TURN").

# ── Identity ────────────────────────────────────────────────────────────────
realm=turn.example.com
server-name=turn.example.com

# Public IP of this machine. Required when the host is behind 1:1 NAT
# (most cloud VMs). Format: external-ip=<public-ip>[/<private-ip>]
# external-ip=203.0.113.10/10.0.0.5

# ── Ports ───────────────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349
# Relay port range; open these UDP ports in your firewall.
min-port=49160
max-port=49200

# ── Auth: long-term credentials ─────────────────────────────────────────────
# These are advertised to clients by the relay's GET /config, so treat them as
# semi-public: the limits below are what keeps the server from being abused.
fingerprint
lt-cred-mech
user=memepals:CHANGE-ME-long-random-password

# ── TLS (for turns:) ────────────────────────────────────────────────────────
# Mount certificates for turn.example.com (e.g. copied from Caddy or certbot).
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
# coturn 4.7 already requires TLS 1.2 or newer.

# ── Abuse limits ────────────────────────────────────────────────────────────
total-quota=20
user-quota=10
# ~2 MB/s per session is plenty for chat + memes.
max-bps=2000000
stale-nonce=600

# Never relay into private, loopback or link-local networks.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# ── No admin surface, no persistent logs ────────────────────────────────────
no-cli
no-rfc5780
# Log to stdout only; docker-compose.yml discards it (logging driver "none").
log-file=stdout
simple-log
